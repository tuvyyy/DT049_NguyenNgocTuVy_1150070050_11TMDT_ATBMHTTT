# Baseline 1: One-Step Multi-Output Ridge Predictor Configuration for DT049
version: "1.0.0"
model:
  name: "one_step_ridge"
  description: "Multi-output one-step Ridge regression predictor: X_hat[t+1] = W * X[t] + b"
  solver: "cholesky"
  fit_intercept: true
  feature_count: 79
  alpha_candidates:
    - 0.01
    - 0.1
    - 1.0
    - 10.0
    - 100.0
    - 300.0
    - 1000.0
    - 3000.0
    - 10000.0
    - 30000.0
    - 100000.0
    - 300000.0
    - 1000000.0
  selection_criterion: "lowest_validation_mean_rmse"
  tie_tolerance:
    atol: 1.0e-6
    rtol: 1.0e-5
  primary_metric: "RMSE"
  descriptive_metrics:
    - "MAE"
    - "MaxAbsResidual"

data:
  development_training:
    features:
      - "data/processed/hai_21_03/train1_features.npy"
      - "data/processed/hai_21_03/train2_features.npy"
    timestamps:
      - "data/processed/hai_21_03/train1_timestamps.npy"
      - "data/processed/hai_21_03/train2_timestamps.npy"
    expected_transitions: 442800  # (216001 - 1) + (226801 - 1)
    train1_transitions: 216000
    train2_transitions: 226800
  normal_validation:
    features:
      - "data/processed/hai_21_03/train3_features.npy"
    timestamps:
      - "data/processed/hai_21_03/train3_timestamps.npy"
    expected_transitions: 478800  # (478801 - 1)
    scored_exposure_seconds: 478800
    scored_exposure_hours: 133.0

threshold_calibration:
  source: "train3 (normal validation only)"
  method: "empirical_quantile"
  numpy_quantile_method: "linear"
  primary_operating_point: "Q99.9"
  operating_targets:
    - name: "Q99.5"
      quantile: 0.995
      role: "sensitivity_lower"
    - name: "Q99.9"
      quantile: 0.999
      role: "primary_operating_point"
    - name: "Q99.99"
      quantile: 0.9999
      role: "sensitivity_upper"
  alarm_rule: "score_t > threshold"
  event_definition: "contiguous run of score_t > threshold with zero smoothing, merging, or filtering"
